[tool.poetry]
name = "orchestration-module"
version = "0.1.0"
description = "Backend Orchestration Module for AI Agentic Retail/Cafe Management System"
authors = ["Your Name <your.email@example.com>"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]